baseURL = "https://bryanchen463.github.io/bryan-s-blog/"
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
title = "Bryan Chen"
theme = "hugo-theme-stack"
publishDir = "public"

[pagination]
  pagerSize = 5

[permalinks]
  posts = "/posts/:filename/"

[taxonomies]
  tag = "tags"
  category = "categories"

[params]
  mainSections = ["posts"]
  rssFullContent = true
  description = "Exploring the flow of code and life. Bryan's blog."

  [params.footer]
    since = 2026
    customText = "Exploring the flow of code & life."

  [params.sidebar]
    avatar = "img/avatar.svg"
    emoji = "BC"
    subtitle = "Notes on code, tools, and everyday experiments."

  [params.article]
    toc = true
    readingTime = true
    headingAnchor = false
    math = false

    [params.article.license]
      enabled = false

  [params.widgets]
    homepage = [
      { type = "search" },
      { type = "archives", params = { limit = 5 } },
      { type = "categories", params = { limit = 10 } },
      { type = "tag-cloud", params = { limit = 10 } },
    ]
    page = [{ type = "toc" }]

  [params.colorScheme]
    toggle = true
    default = "auto"

  [params.comments]
    enabled = false

[[menu.social]]
  identifier = "github"
  name = "GitHub"
  url = "https://github.com/bryanchen463/bryan-s-blog"

  [menu.social.params]
    icon = "brand-github"

[[menu.main]]
  identifier = "home"
  name = "Home"
  url = "/"
  weight = 10

[[menu.main]]
  identifier = "archives"
  name = "Archives"
  url = "/archives/"
  weight = 20

[[menu.main]]
  identifier = "categories"
  name = "Categories"
  url = "/categories/"
  weight = 30

[[menu.main]]
  identifier = "tags"
  name = "Tags"
  url = "/tags/"
  weight = 40
